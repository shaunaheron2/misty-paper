<text x="106" y="738" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1b" text-anchor="start">Task 2 — Collaborative log interpretation (“missing robot”)</text>
<text x="106" y="757" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Participant and robot jointly reason over cryptic system logs; robot provides guidance without knowing</text>
<text x="106" y="772" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">the solution.</text>
<rect x="549.1923828125" y="701" width="118.8076171875" height="18" fill="#1d1d1b"></rect>
<text x="608.59619140625" y="713.5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.7">Optional collaboration</text>
