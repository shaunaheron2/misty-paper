<text x="106" y="627" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1b" text-anchor="start">Task 1 — Collaborative suspect elimination (“who-dunnit”)</text>
<text x="106" y="646" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">Participant asks yes/no questions; robot holds ground-truth knowledge and answers feature-based</text>
<text x="106" y="661" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="start">queries.</text>
<rect x="546.543701171875" y="590" width="121.456298828125" height="18" fill="#1d1d1b"></rect>
<text x="607.2718505859375" y="602.5" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.7">Enforced collaboration</text>
